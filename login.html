<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar — EduBridge</title><link rel="stylesheet" href="css/styles.css"></head>
<body class="login-page"><main class="login-card"><img class="login-logo" src="assets/edubridge-logo.jpg" alt="EduBridge"><p class="muted center">Censo estudiantil post-desastres</p>
<div id="notice" class="notice hidden"></div><form id="auth-form" class="stack">
<div id="name-wrap" class="field hidden"><label for="name">Nombre completo</label><input id="name" autocomplete="name"></div>
<div class="field"><label for="email">Correo</label><input id="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="password">Contraseña</label><input id="password" type="password" minlength="8" autocomplete="current-password" required></div>
<button id="submit-auth" class="btn primary full" type="submit">Ingresar</button></form>

<button id="toggle-auth" class="text-button full" type="button">¿No tienes cuenta? Regístrate</button>
<p class="small muted center">El registro requiere confirmación por correo y aprobación de un administrador.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="js/app.js"></script><script src="js/login.js"></script></body></html>
