<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reportar estudiante — EduBridge</title><link rel="stylesheet" href="css/styles.css"></head><body>
<div id="app-header"></div><main class="main-content"><form id="report-form" class="content-card form-layout"><h1>Reportar estudiante</h1><p class="muted">Registra el estado y la ubicación actual del estudiante.</p><div id="notice" class="notice hidden"></div>
<div class="grid two"><div class="field"><label for="doc">Documento / código</label><input id="doc" required autocomplete="off"><p id="known" class="small primary-text hidden">Estudiante ya registrado: se cargaron sus datos.</p></div><div class="field"><label for="grade">Grado / sección</label><input id="grade" placeholder="Ej. 7°B" required></div></div>
<div class="field"><label for="student-name">Nombre completo</label><input id="student-name" required></div>
<div class="field"><label>Estado del estudiante</label><div id="status-options" class="status-grid">
<button type="button" class="status-choice selected safe" data-status="a_salvo">✓ A salvo</button><button type="button" class="status-choice assist" data-status="requiere_asistencia">Requiere asistencia</button><button type="button" class="status-choice injured" data-status="herido">Herido</button><button type="button" class="status-choice missing" data-status="desaparecido">Desaparecido</button></div></div>
<div class="field"><label for="zone">Ubicación actual</label><button id="gps-btn" type="button" class="btn outline full">⌖ Activar GPS</button><input id="zone" list="zones" placeholder="Zona detectada o escribe una ubicación"><datalist id="zones"><option>Sede Principal</option><option>Sede Norte</option><option>Sede Sur</option><option>Punto de encuentro A</option><option>Punto de encuentro B</option><option>Albergue municipal</option><option>Hospital</option><option>Domicilio</option></datalist><p id="gps-help" class="small muted">La zona se puede completar con GPS; puedes corregirla.</p></div>
<div class="field"><label for="notes">Observaciones (opcional)</label><textarea id="notes" rows="3"></textarea></div><button class="btn primary full" type="submit">Guardar reporte</button></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="js/app.js"></script><script src="js/reportar.js"></script></body></html>
