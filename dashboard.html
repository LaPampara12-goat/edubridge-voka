<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de control — EduBridge</title><link rel="stylesheet" href="css/styles.css"></head><body><div id="app-header"></div><main class="main-content"><section class="stack"><div class="page-heading"><div><h1>Panel de control</h1><p class="muted">Consolidado del censo estudiantil.</p></div><div class="button-row"><button id="export-csv" class="btn outline">Descargar CSV</button><button id="refresh" class="btn outline">Actualizar</button></div></div><div id="notice" class="notice hidden"></div>
<div class="filters"><div class="field"><label for="grade-filter">Grado</label><select id="grade-filter"><option value="">Todos los grados</option></select></div><div class="field"><label for="from-date">Desde</label><input type="date" id="from-date"></div><div class="field"><label for="to-date">Hasta</label><input type="date" id="to-date"></div></div>
<div class="stats-grid"><article class="stat-card"><span>Total de estudiantes</span><strong id="total-count">0</strong></article><article class="stat-card safe"><span>A salvo</span><strong id="safe-count">0</strong></article><article class="stat-card assist"><span>Requieren asistencia</span><strong id="assist-count">0</strong></article><article class="stat-card injured"><span>Heridos</span><strong id="injured-count">0</strong></article><article class="stat-card missing"><span>Desaparecidos</span><strong id="missing-count">0</strong></article></div>
<div class="content-card"><h2>Zonas afectadas</h2><div id="zones-list" class="zones-list"></div></div>
<div class="content-card"><h2>Últimos reportes</h2><div class="table-wrap"><table><thead><tr><th>Documento</th><th>Nombre</th><th>Grado</th><th>Estado</th><th>Zona</th><th>Fecha</th><th></th></tr></thead><tbody id="report-rows"></tbody></table></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="js/app.js"></script><script src="js/dashboard.js"></script></body></html>
